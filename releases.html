        <script>
        var page=0;
        var last=false;
        var totalDownloadCount = 0;
        function GetReleases() {
            if(!last){
                ++page;
                var asset = {
                    tag_name: "2112260533",
                    file_size: "16.0 MB",
                    download_count: "-",
                    updated_at: "현재 작업공간",
                    browser_download_url: "https://github.com/ad2das/mangaviewer/releases/download/codex/perf-stability-max-core-rewrite-v2112260512/mangaViewer_2112260533-debug.apk"
                };
                $(".table-downloads tbody")
                    .append($("<tr>")
                        .append($("<td>").text(asset.tag_name))
                        .append($("<td>").text(asset.file_size))
                        .append($("<td>").text(asset.download_count))
                        .append($("<td>").text(asset.updated_at))
                        .append($("<td>")
                            .append($("<button>")
                                .attr("onclick", "location.href='"+asset.browser_download_url+"';")
                                .text("다운로드")
                            )
                        )
                    );
                    $("table-downloads").fadeIn();
                    last = true;
                    document.getElementById("more").style.display = "none";
            }
        }

        function GetParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
            var results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return "";
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }
        window.onload = function() {
            setTimeout(function (){
                $("div.title").fadeIn('slow');
                $("div.content").fadeIn('slow');
                $("div.footer").fadeIn('slow');
                GetReleases();
            }, 800);
        }
        </script>
