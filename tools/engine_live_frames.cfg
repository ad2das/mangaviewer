buffers { size_kb: 32768 fill_policy: RING_BUFFER }
buffers { size_kb: 4096 fill_policy: RING_BUFFER }
buffers { size_kb: 16384 fill_policy: RING_BUFFER }
write_into_file: true
file_write_period_ms: 1000
flush_period_ms: 1000
producers { producer_name: "perfetto.traced_probes" shm_size_kb: 8192 }
data_sources { config { name: "android.surfaceflinger.frame" } }
data_sources { config { name: "android.surfaceflinger.frametimeline" } }
data_sources { config {
  name: "android.surfaceflinger.transactions"
  target_buffer: 2
  surfaceflinger_transactions_config { mode: MODE_ACTIVE }
} }
data_sources { config {
  name: "linux.ftrace"
  ftrace_config {
    # Keep Perfetto's default BOOTTIME; RAW requires best-effort ftrace alignment.
    ftrace_events: "sched/sched_switch"
    ftrace_events: "sched/sched_wakeup"
    ftrace_events: "binder/binder_transaction"
    ftrace_events: "binder/binder_transaction_received"
    ftrace_events: "binder/binder_transaction_buffer_release"
    atrace_categories: "gfx"
    atrace_categories: "view"
    atrace_categories: "input"
    atrace_categories: "wm"
    atrace_categories: "am"
    atrace_apps: "ml.melun.mangaview"
    compact_sched { enabled: true }
  }
} }
data_sources { config {
  name: "linux.process_stats"
  target_buffer: 1
  process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 100 }
} }
builtin_data_sources {
  primary_trace_clock: BUILTIN_CLOCK_MONOTONIC
}
incremental_state_config {
  clear_period_ms: 1000
}
