name: Update comic classification DB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: write

concurrency:
  group: classification-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore source detail cache
        uses: actions/cache@v4
        with:
          path: .comic-source-detail-cache.json
          key: comic-source-detail-cache-${{ github.run_id }}
          restore-keys: |
            comic-source-detail-cache-

      - name: Rebuild classification DB
        run: |
          python -X utf8 tools/build_comic_classification.py \
            --delay 0.05 \
            --source-workers 16 \
            --source-detail-workers 16 \
            --no-resolve \
            --unclassified-output comic-classification-unclassified.json

      - name: Resolve classification DB
        run: |
          python -X utf8 tools/classification/collect_external_evidence.py infer-descriptions \
            --db comic-classification.json \
            --output tools/classification/comic-external-evidence.jsonl
          python -X utf8 tools/classification/resolve_classification.py \
            --kind comic \
            --input comic-classification.json \
            --output tools/classification/tmp-comic-base.json \
            --external-evidence tools/classification/comic-external-evidence.jsonl \
            --external-evidence tools/classification/comic-kitsu-evidence.jsonl \
            --external-evidence tools/classification/comic-mangadex-evidence.sample.jsonl \
            --external-evidence tools/classification/comic-mangaupdates-evidence.jsonl \
            --external-evidence tools/classification/comic-naver-book-evidence.jsonl \
            --external-evidence tools/classification/comic-kyobo-evidence.jsonl
          python -X utf8 tools/classification/build_description_neighbor_evidence.py \
            --db tools/classification/tmp-comic-base.json \
            --output tools/classification/comic-neighbor-evidence.jsonl \
            --min-score 0.08 \
            --max-neighbors 7
          python -X utf8 tools/classification/resolve_classification.py \
            --kind comic \
            --input comic-classification.json \
            --output tools/classification/tmp-comic-neighbor.json \
            --external-evidence tools/classification/comic-external-evidence.jsonl \
            --external-evidence tools/classification/comic-neighbor-evidence.jsonl \
            --external-evidence tools/classification/comic-kitsu-evidence.jsonl \
            --external-evidence tools/classification/comic-mangadex-evidence.sample.jsonl \
            --external-evidence tools/classification/comic-mangaupdates-evidence.jsonl \
            --external-evidence tools/classification/comic-naver-book-evidence.jsonl \
            --external-evidence tools/classification/comic-kyobo-evidence.jsonl
          python -X utf8 tools/classification/build_last_resort_evidence.py \
            --db tools/classification/tmp-comic-neighbor.json \
            --taxonomy tools/classification/taxonomy.json \
            --output tools/classification/comic-last-resort-evidence.jsonl
          python -X utf8 tools/classification/resolve_classification.py \
            --kind comic \
            --input comic-classification.json \
            --output comic-classification.json \
            --asset-output app/src/main/assets/comic-classification.json \
            --strip-source-tags \
            --external-evidence tools/classification/comic-external-evidence.jsonl \
            --external-evidence tools/classification/comic-neighbor-evidence.jsonl \
            --external-evidence tools/classification/comic-kitsu-evidence.jsonl \
            --external-evidence tools/classification/comic-mangadex-evidence.sample.jsonl \
            --external-evidence tools/classification/comic-mangaupdates-evidence.jsonl \
            --external-evidence tools/classification/comic-naver-book-evidence.jsonl \
            --external-evidence tools/classification/comic-kyobo-evidence.jsonl \
            --external-evidence tools/classification/comic-last-resort-evidence.jsonl

      - name: Validate classification DB
        run: |
          python -X utf8 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("comic-classification.json")
          asset = Path("app/src/main/assets/comic-classification.json")
          root_data = json.loads(root.read_text(encoding="utf-8"))
          asset_data = json.loads(asset.read_text(encoding="utf-8"))
          assert root_data == asset_data, "root DB and APK asset DB differ"

          titles = root_data.get("titles", {})
          assert isinstance(titles, dict) and titles, "titles must be a non-empty object"
          forced = [
              (key, item.get("name"))
              for key, item in titles.items()
              if item.get("classification", {}).get("flags", {}).get("nonEmptyForced")
              or item.get("classification", {}).get("confidenceLabel") == "forced_placeholder"
          ]
          assert not forced, f"forced placeholder classifications remain: {forced[:20]}"
          unclassified = [key for key, item in titles.items() if not item.get("resolvedTags")]
          assert not unclassified, f"unclassified titles remain: {len(unclassified)}"

          print("titles", len(titles))
          print("unclassified", len(unclassified))
          print("manual", sum(1 for item in titles.values() if item.get("manual")))
          print("sha256", hashlib.sha256(root.read_bytes()).hexdigest())
          PY
          python -X utf8 tools/classification/audit_classification.py
          python -X utf8 tools/audit_genre_result_coverage.py

      - name: Commit DB changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comic-classification.json app/src/main/assets/comic-classification.json comic-classification-unclassified.json tools/classification/comic-external-evidence.jsonl tools/classification/comic-neighbor-evidence.jsonl tools/classification/comic-last-resort-evidence.jsonl
          if git diff --cached --quiet; then
            echo "No classification DB changes."
          else
            git commit -m "Update comic classification DB"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Failed to push classification DB update after retries." >&2
            exit 1
          fi
