name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ntk01
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "webtoon-classification.json"
      - "comic-classification.json"
      - "webtoon-classification-unclassified.json"
      - "comic-classification-unclassified.json"
      - "app/src/main/assets/webtoon-classification.json"
      - "app/src/main/assets/comic-classification.json"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
      RELEASE_TAG: ${{ github.ref_name == 'ntk01' && 'ntk-drag-longpress-guard-v2112260611' || 'main-v2112260569' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore Firebase resources
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Release latest debug APK
        shell: pwsh
        run: ./tools/release_latest.ps1 -ReleaseTag "$env:RELEASE_TAG" -TargetBranch "${{ github.ref_name }}" -SkipTests -DeleteOldReleaseApks
