      - name: Test and build APK
        shell: pwsh
        run: |
          .\gradlew.bat testDebugUnitTest assembleDebug

      - name: Update release metadata
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem app\build\outputs\apk\debug\*.apk | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $apk) { throw 'APK was not produced' }
          $versionCode = [regex]::Match($apk.BaseName, '(\d+)').Groups[1].Value
          if(-not $versionCode) { throw "Could not parse version code from $($apk.Name)" }
          $safeBranch = $env:BRANCH -replace '[^A-Za-z0-9._-]', '-'
          $tag = "$safeBranch-v$versionCode"
          $url = "https://github.com/$env:REPO/releases/download/$tag/$($apk.Name)"
          Set-Content version.json "{`"version`":$versionCode,`"link`":`"$url`"}"
          (Get-Content releases.html -Raw) `
            -replace 'apk/mangaViewer_\d+-debug\.apk', $url |
            Set-Content releases.html -NoNewline

      - name: Commit patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ml/melun/mangaview/mangaview/Manga.java `
                  app/src/main/java/ml/melun/mangaview/activity/ViewerActivity.java `
                  app/src/test/java/ml/melun/mangaview/mangaview/MangaEpisodeNavigationTest.java `
                  version.json releases.html
          if(git diff --cached --quiet) {
            "No patch changes to commit"
          } else {
            git commit -m "Fix continuous reader episode boundary detection"
            git push
          }

      - name: Publish single branch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem app\build\outputs\apk\debug\*.apk | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $versionCode = [regex]::Match($apk.BaseName, '(\d+)').Groups[1].Value
          $safeBranch = $env:BRANCH -replace '[^A-Za-z0-9._-]', '-'
          $tag = "$safeBranch-v$versionCode"
          $targetSha = git rev-parse HEAD

          $releaseRows = gh api "repos/$env:REPO/releases" --paginate --jq '.[] | [.id, .tag_name, .target_commitish] | @tsv'
          foreach($row in @($releaseRows)) {
            $parts = $row -split "`t"
            if($parts.Length -ge 3 -and $parts[2] -eq $env:BRANCH) {
              gh api -X DELETE "repos/$env:REPO/releases/$($parts[0])"
              if($parts[1]) {
                gh api -X DELETE "repos/$env:REPO/git/refs/tags/$($parts[1])" 2>$null
              }
            }
          }

          gh release create $tag $apk.FullName `
            --repo $env:REPO `
            --target $targetSha `
            --title "$env:BRANCH $versionCode" `
            --notes "Debug APK for $env:BRANCH at $targetSha"
