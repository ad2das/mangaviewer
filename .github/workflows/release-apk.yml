name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/release_latest.ps1"
      - "tools/README_RELEASE.md"
      - ".github/workflows/release-apk.yml"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

concurrency:
  group: release-apk-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release latest debug APK
        shell: pwsh
        run: ./tools/release_latest.ps1
