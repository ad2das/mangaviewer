name: Release APK

on:
  workflow_dispatch:
    inputs:
      refresh_gradle_cache:
        description: "Save an updated Gradle cache after the build. Leave off for the fastest release build."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "webtoon-classification.json"
      - "webtoon-classification-*.json"
      - "comic-classification.json"
      - "comic-classification-*.json"
      - "tools/classification/**"
      - ".github/workflows/update-classification-db.yml"
      - ".github/workflows/update-webtoon-classification.yml"
      - ".github/workflows/update-comic-classification.yml"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_name == 'main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
      CI_RELEASE_PATCH_FLOOR: 1000000
      SYNC_RELEASE_METADATA_TO_BRANCH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /config/
            /gradle/
            /tools/patch_apk_manifest_version.py
            /tools/release_latest_ci.sh
            /tools/release_latest.ps1
            /build.gradle
            /gradle.properties
            /gradlew
            /settings.gradle
            /version.json
            /releases.html
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest branch head
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${latest_sha}" ] && [ "${latest_sha}" != "${GITHUB_SHA}" ]; then
            echo "STALE_RELEASE_RUN=true" >> "${GITHUB_ENV}"
            echo "Skipping stale release run for ${GITHUB_SHA}; latest is ${latest_sha}."
          else
            echo "STALE_RELEASE_RUN=false" >> "${GITHUB_ENV}"
          fi

      - name: Set up JDK 17
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        if: env.STALE_RELEASE_RUN != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'push' || github.event.inputs.refresh_gradle_cache != 'true' }}
          cache-cleanup: never
          gradle-home-cache-excludes: |
            caches/journal-*
            caches/keyrings

      - name: Restore Android incremental build state
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle/8.13/executionHistory
            .gradle/8.13/fileHashes
            .gradle/configuration-cache
            app/build
          key: release-apk-app-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            release-apk-app-build-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore Firebase resources
        if: env.STALE_RELEASE_RUN != 'true'
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Release latest signed APK
        if: env.STALE_RELEASE_RUN != 'true'
        shell: bash
        run: |
          bash tools/release_latest_ci.sh

      - name: Save Android incremental build state
        if: env.STALE_RELEASE_RUN != 'true' && (github.event_name == 'push' || github.event.inputs.refresh_gradle_cache == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            .gradle/8.13/executionHistory
            .gradle/8.13/fileHashes
            .gradle/configuration-cache
            app/build
          key: release-apk-app-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

