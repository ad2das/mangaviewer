name: Release APK

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build APK Artifact run id to promote. Leave empty to use the latest successful run."
        required: false
        type: string
  workflow_run:
    workflows:
      - Build APK Artifact
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-apk-main
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
      BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote APK artifact
        shell: pwsh
        run: ./tools/promote_release_artifact.ps1 -BuildRunId "$env:BUILD_RUN_ID"
