name: Patch and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Patch reader episode navigation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mangaPath = 'app/src/main/java/ml/melun/mangaview/mangaview/Manga.java'
          $manga = Get-Content $mangaPath -Raw
          if($manga -notmatch 'effectiveEpisodes\(\)') {
            $manga = [regex]::Replace($manga, '(?s)    public Manga nextEp\(\) \{.*?    public void setPrevEp', @'
    public Manga nextEp() {
        if (isOnline()) {
            List<Manga> episodes = effectiveEpisodes();
            if (episodes == null || episodes.size() == 0) {
                return null;
            } else {
                int index = findEpisodeIndex(episodes);
                if (index < 0) return null;
                for (int i = index - 1; i >= 0; i--) {
                    Manga episode = episodes.get(i);
                    if (episode != null && episode.getId() != id) return episode;
                }
                return null;
            }
        } else {
            return nextEp;
        }
    }

    public Manga prevEp() {
        if (isOnline()) {
            List<Manga> episodes = effectiveEpisodes();
            if (episodes == null || episodes.size() == 0) {
                return null;
            } else {
                int index = findEpisodeIndex(episodes);
                if (index < 0) return null;
                for (int i = index + 1; i < episodes.size(); i++) {
                    Manga episode = episodes.get(i);
                    if (episode != null && episode.getId() != id) return episode;
                }
                return null;
            }
        } else {
            return prevEp;
        }
    }

    private List<Manga> effectiveEpisodes() {
        List<Manga> titleEpisodes = title == null ? null : title.getEps();
        if(titleEpisodes != null && titleEpisodes.size() > 0
                && (eps == null || titleEpisodes.size() >= eps.size()))
            return titleEpisodes;
        return eps;
    }

    private int findEpisodeIndex(List<Manga> episodes) {
        if (episodes == null) return -1;
        for (int i = 0; i < episodes.size(); i++) {
            Manga episode = episodes.get(i);
            if (episode == this) return i;
        }
        for (int i = 0; i < episodes.size(); i++) {
            Manga episode = episodes.get(i);
            if (episode != null && episode.getId() == id) return i;
        }
        return -1;
    }

