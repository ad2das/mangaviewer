name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "webtoon-classification.json"
      - "comic-classification.json"
      - "webtoon-classification-unclassified.json"
      - "comic-classification-unclassified.json"
      - "app/src/main/assets/webtoon-classification.json"
      - "app/src/main/assets/comic-classification.json"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_name == 'main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore Firebase resources
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Release latest signed APK
        shell: pwsh
        run: |
          $patchMatch = Select-String -Path app/build.gradle -Pattern 'def\s+defaultReleasePatch\s*=\s*(\d+)'
          if (-not $patchMatch) {
            throw "Could not find defaultReleasePatch in app/build.gradle"
          }
          $patchBase = [int]$patchMatch.Matches[0].Groups[1].Value
          $releasePatch = $patchBase + [int]"${{ github.run_number }}"
          ./tools/release_latest.ps1 `
            -TargetBranch "${{ github.ref_name }}" `
            -ReleasePatch $releasePatch `
            -SkipTests `
            -NoCommit `
            -DeleteOldReleaseApks
