name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Update release metadata
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          apk = sorted(Path("app/build/outputs/apk/debug").glob("*.apk"), key=lambda p: p.stat().st_mtime)[-1]
          version = re.search(r"(\d+)", apk.stem).group(1)
          branch = os.environ["GITHUB_REF_NAME"]
          safe_branch = re.sub(r"[^A-Za-z0-9._-]", "-", branch)
          tag = f"{safe_branch}-v{version}"
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{apk.name}"
          Path("version.json").write_text(json.dumps({"version": int(version), "link": url}, separators=(",", ":")) + "\n")
          releases = Path("releases.html")
          releases.write_text(re.sub(r"(?:apk/mangaViewer_\d+-debug\.apk|https://github\.com/[^\s\"']+/releases/download/[^\s\"']+\.apk)", url, releases.read_text()))
          PY

      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add version.json releases.html
          if ! git diff --cached --quiet; then
            git commit -m "Update APK release metadata"
            git push
          fi

      - name: Publish single branch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls -t app/build/outputs/apk/debug/*.apk | head -n 1)"
          version="$(basename "$apk" | grep -oE '[0-9]+' | head -n 1)"
          safe_branch="$(echo "$GITHUB_REF_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          tag="$safe_branch-v$version"
          target_sha="$(git rev-parse HEAD)"

          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | [.id, .tag_name, .target_commitish] | @tsv' |
          while IFS=$'\t' read -r id old_tag target; do
            if [ "$target" = "$GITHUB_REF_NAME" ] || [[ "$old_tag" == "$safe_branch-v"* ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              if [ -n "$old_tag" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$old_tag" || true
              fi
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$safe_branch-v" --jq '.[].ref' |
          while read -r ref; do
            [ -n "$ref" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" || true
          done

          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target_sha" \
            --title "$GITHUB_REF_NAME $version" \
            --notes "Debug APK for $GITHUB_REF_NAME at $target_sha"
