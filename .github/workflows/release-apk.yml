name: Release APK

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build APK Artifact run id to promote. Leave empty to use the latest successful run."
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "webtoon-classification.json"
      - "comic-classification.json"
      - "webtoon-classification-unclassified.json"
      - "comic-classification-unclassified.json"
      - "app/src/main/assets/webtoon-classification.json"
      - "app/src/main/assets/comic-classification.json"
      - "*.png"
      - "*.xml"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-apk-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote APK artifact
        shell: pwsh
        run: ./tools/promote_release_artifact.ps1 -BuildRunId "$env:BUILD_RUN_ID"
