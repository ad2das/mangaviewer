name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_name == 'main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest branch head
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ -n "${latest_sha}" ] && [ "${latest_sha}" != "${GITHUB_SHA}" ]; then
            echo "STALE_RELEASE_RUN=true" >> "${GITHUB_ENV}"
            echo "Skipping stale release run for ${GITHUB_SHA}; latest is ${latest_sha}."
          else
            echo "STALE_RELEASE_RUN=false" >> "${GITHUB_ENV}"
          fi

      - name: Set up JDK 17
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        if: env.STALE_RELEASE_RUN != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Configure Git
        if: env.STALE_RELEASE_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore Firebase resources
        if: env.STALE_RELEASE_RUN != 'true'
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Release latest signed APK
        if: env.STALE_RELEASE_RUN != 'true'
        shell: pwsh
        run: |
          $patchMatch = Select-String -Path app/build.gradle -Pattern 'def\s+defaultReleasePatch\s*=\s*(\d+)'
          if (-not $patchMatch) {
            throw "Could not find defaultReleasePatch in app/build.gradle"
          }
          $patchBase = [int]$patchMatch.Matches[0].Groups[1].Value
          $releasePatch = $patchBase + [int]"${{ github.run_number }}"
          ./tools/release_latest.ps1 `
            -TargetBranch "${{ github.ref_name }}" `
            -ReleasePatch $releasePatch `
            -SkipTests `
            -NoCommit `
            -DeleteOldReleaseApks

      - name: Upload APK artifact
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mangaviewer-release-apk
          path: |
            app/build/outputs/apk/debug/*-debug.apk
            version.json
          if-no-files-found: error
          retention-days: 14
