name: Release APK

on:
  workflow_dispatch:
    inputs:
      refresh_gradle_cache:
        description: "Save an updated Gradle cache after the build. Leave off for the fastest release build."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
      - "releases.html"
      - "version.json"
      - "tools/README_RELEASE.md"
      - "webtoon-classification.json"
      - "webtoon-classification-*.json"
      - "comic-classification.json"
      - "comic-classification-*.json"
      - "tools/classification/**"
      - ".github/workflows/update-classification-db.yml"
      - ".github/workflows/update-webtoon-classification.yml"
      - ".github/workflows/update-comic-classification.yml"
      - "*.png"
      - "*.xml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_name == 'main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul
      CI_RELEASE_PATCH_FLOOR: 1000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /config/
            /gradle/
            /tools/release_latest.ps1
            /build.gradle
            /gradle.properties
            /gradlew
            /settings.gradle
            /version.json
            /releases.html
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest branch head
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${latest_sha}" ] && [ "${latest_sha}" != "${GITHUB_SHA}" ]; then
            echo "STALE_RELEASE_RUN=true" >> "${GITHUB_ENV}"
            echo "Skipping stale release run for ${GITHUB_SHA}; latest is ${latest_sha}."
          else
            echo "STALE_RELEASE_RUN=false" >> "${GITHUB_ENV}"
          fi

      - name: Set up JDK 17
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        if: env.STALE_RELEASE_RUN != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
          gradle-home-cache-excludes: |
            caches/journal-*
            caches/keyrings

      - name: Restore Android incremental build state
        if: env.STALE_RELEASE_RUN != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .gradle/configuration-cache
            app/build
          key: release-apk-app-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            release-apk-app-build-${{ runner.os }}-${{ github.ref_name }}-

      - name: Configure Git
        if: env.STALE_RELEASE_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore Firebase resources
        if: env.STALE_RELEASE_RUN != 'true'
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Release latest signed APK
        if: env.STALE_RELEASE_RUN != 'true'
        shell: pwsh
        run: |
          $patchMatch = Select-String -Path app/build.gradle -Pattern 'def\s+defaultReleasePatch\s*=\s*(\d+)'
          if (-not $patchMatch) {
            throw "Could not find defaultReleasePatch in app/build.gradle"
          }
          $patchBase = [int]$patchMatch.Matches[0].Groups[1].Value
          # Reserve a CI-only patch range so GitHub-built APKs stay above local debug builds from the same date.
          $releasePatch = $patchBase + [int]$env:CI_RELEASE_PATCH_FLOOR + [int]"${{ github.run_number }}"
          Write-Host "releasePatchBase=$patchBase ciFloor=$env:CI_RELEASE_PATCH_FLOOR runNumber=${{ github.run_number }} releasePatch=$releasePatch"
          ./tools/release_latest.ps1 `
            -TargetBranch "${{ github.ref_name }}" `
            -ReleasePatch $releasePatch `
            -SkipTests `
            -SkipClassificationAssets `
            -NoCommit `
            -DeleteOldReleaseApks

      - name: Sync branch update metadata
        if: env.STALE_RELEASE_RUN != 'true'
        shell: pwsh
        run: |
          $latestSha = (git ls-remote origin "refs/heads/${{ github.ref_name }}" | ForEach-Object { ($_ -split "\s+")[0] })
          if ($latestSha -ne "${{ github.sha }}") {
            Write-Host "Skipping metadata sync because branch moved from ${{ github.sha }} to $latestSha"
            exit 0
          }
          $versionInfo = Get-Content -Path version.json -Raw | ConvertFrom-Json
          git add -- version.json releases.html
          $metadataChanges = git status --porcelain -- version.json releases.html
          if (-not $metadataChanges) {
            Write-Host "No release metadata changes to sync"
            exit 0
          }
          git commit -m "Update release metadata $($versionInfo.version) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

