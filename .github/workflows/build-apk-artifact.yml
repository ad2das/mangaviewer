name: Build APK Artifact

on:
  workflow_dispatch:
    inputs:
      refresh_gradle_cache:
        description: "Save an updated Gradle cache after the build. Leave off for the fastest APK build."
        required: false
        default: false
        type: boolean
  push:
    branches-ignore:
      - main
      - ntk01

permissions:
  contents: read

concurrency:
  group: build-apk-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      RELEASE_TAG: codex/perf-stability-max-core-rewrite-v2112260512
      REPO_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /core/
            /data/
            /source-api/
            /source-ntk/
            /source-wfwf/
            /viewer/
            /config/
            /gradle/
            /build.gradle
            /gradle.properties
            /gradlew
            /settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_gradle_cache }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/journal-*
            caches/keyrings

      - name: Restore Firebase resources
        shell: bash
        env:
          GOOGLE_SERVICES_XML: ${{ secrets.GOOGLE_SERVICES_XML }}
        run: |
          if [ -n "$GOOGLE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$GOOGLE_SERVICES_XML" > app/src/main/res/values/google_services.xml
          fi

      - name: Build debug APK artifact
        shell: bash
        run: |
          set -euo pipefail

          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' app/build.gradle | head -n 1)"
          version_name="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\1/p" app/build.gradle | head -n 1)"
          if [ -z "${version_code}" ] || [ -z "${version_name}" ]; then
            echo "Could not read versionCode/versionName from app/build.gradle" >&2
            exit 1
          fi
          apk_name="mangaViewer_${version_code}-debug.apk"
          download_url="https://github.com/${REPO_NAME}/releases/download/${RELEASE_TAG}/${apk_name}"

          chmod +x ./gradlew
          ./gradlew --build-cache --parallel :app:assembleDebug

          stable_apk="$(python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text(encoding="utf-8"))
          print(Path("app/build/outputs/apk/debug") / metadata["elements"][0]["outputFile"])
          PY
          )"
          test -f "${stable_apk}"
          mkdir -p release-artifact
          cp "${stable_apk}" "release-artifact/${apk_name}"
          cat > release-artifact/release-metadata.json <<JSON
          {
            "versionCode": ${version_code},
            "versionName": "${version_name}",
            "apkName": "${apk_name}",
            "downloadUrl": "${download_url}",
            "releaseTag": "${RELEASE_TAG}",
            "headSha": "${{ github.sha }}",
            "buildRunId": "${{ github.run_id }}",
            "workflowRunNumber": "${{ github.run_number }}"
          }
          JSON

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangaviewer-debug-apk
          path: release-artifact/*
          if-no-files-found: error
          retention-days: 14
