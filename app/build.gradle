apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'ml.melun.mangaview'
    compileSdkVersion 36

    defaultConfig {
        applicationId 'ml.melun.mangaview'
        // The native viewer decodes full-quality bands with the NDK AImageDecoder API and uploads
        // them to one EGL/GLES scene. AImageDecoder's complete contract starts at API 30.
        minSdkVersion 30
        targetSdkVersion 35
        versionCode 2147000000
        versionName '5.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('config/mangaviewer-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Releases are installed directly over legacy builds whose date-based codes already
        // exceed Google Play's 2.1B publishing ceiling. Lowering this would make Android reject
        // the upgrade; the app is not distributed through Play.
        disable 'HighAppVersionCode'
    }

    packagingOptions {
        resources.excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
        ]
    }
}

dependencies {
    implementation project(':core')
    implementation project(':source-api')
    implementation project(':source-ntk')
    implementation project(':source-wfwf')
    implementation project(':data')
    implementation project(':viewer')
    implementation project(':viewer-content')
    implementation project(':engine-api')
    implementation project(':engine-v2')

    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
