/* ====== Chapter Menu Floating Button ====== */
.chapter-menu-bar { display:none; position:absolute; top:100%; right:0; z-index:500; margin-top:4px; }

.filter {

.filter-row { padding: 6px 16px;

  background:#f1f2f5; border:1px solid var(--border);
  transition:all .15s; padding:0; cursor:pointer;
}
.plat-chip:hover { background:#e6e8ec; }
.plat-chip.active { border-color:var(--accent); background:rgba(230,57,70,.08); }
.plat-chip img { width:22px; height:22px; border-radius:3px; }

/* ====== 정렬 + 카운트 ====== */
.result-bar {
  max-width:1200px; margin:16px auto 0; padding:0 16px;
  display:flex; align-items:center; justify-content:space-between;
}
.result-count { font-size:13px; color:var(--t2); }
.sort-tabs { display:flex; gap:4px; }
.sort-tabs button, .sort-tabs a {
  font-size:12.5px; padding:6px 12px; border-radius:6px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--t2); cursor:pointer; text-decoration:none;
  transition:all .15s;
}
.sort-tabs button.active, .sort-tabs a.on {
  background:var(--accent); color:#fff; border-color:var(--accent);
}

/* ====== 카드 그리드 ====== */
.card-grid {
  max-width:1200px; margin:16px auto; padding:0 16px;
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:12px;
}
.card {
  background:var(--surface); border-radius:16px;
  overflow:hidden; text-decoration:none; color:var(--text);
  transition:transform .15s, box-shadow .15s;
  display:block;
}
.card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
.card .thumb {
  position:relative; width:100%; aspect-ratio:4/3;
  overflow:hidden; background:#e5e7eb;
}
.card .thumb img {
  width:100%; height:100%; object-fit:cover;
  display:block; background:#e8eaed;
}
.card .thumb .platform-icon {
  position:absolute; top:4px; right:4px; width:23px; height:23px;
  border-radius:3px; z-index:1;
}
.card .thumb .up-badge {
  position:absolute; top:4px; left:4px;
  width:23px; height:23px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
  border-radius:4px;
  background:var(--accent); color:#fff;
  z-index:2;
}
.wp-manga-chapter .up-badge-inline {
  display:inline-block; margin-right:4px; padding:0 4px;
  font-size:9px; font-weight:700; line-height:16px;
  border-radius:3px; background:var(--accent); color:#fff; vertical-align:2px;
}
.card .info { padding:8px 10px 10px; }
.card .subject {
  font-size:13px; font-weight:500; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card .genre {
  font-size:11.5px; color:var(--t2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  margin-top:2px;
}
.card .ep {
  font-size:11.5px; color:var(--text); margin-top:2px;
}
.card .ep .ep-no { font-weight:500; }
.card .ep .ep-date { font-size:11px; color:var(--t2); margin-left:6px; }
.ep-date-ov {
  position:absolute; bottom:4px; right:4px; z-index:2;
  background:rgba(0,0,0,.55); color:#fff;
  font-size:11px; font-weight:500; padding:2px 6px;
  border-radius:4px; line-height:1.3;
  backdrop-filter:blur(2px);
}
.card .ep .ep-date { color:var(--t2); margin-left:4px; }

/* ====== 페이지네이션 ====== */
.pagination {
  max-width:1200px; margin:0 auto 32px; padding:0 16px;
  display:flex; justify-content:center; gap:4px;
}
.pagination a, .pagination span {
  font-size:13px; padding:6px 12px; border-radius:6px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); text-decoration:none;
  transition:all .15s; min-width:36px; text-align:center;
}
.pagination a:hover { border-color:var(--accent); color:var(--accent); }
.pagination .current {
  background:var(--accent); color:#fff; border-color:var(--accent);
}

/* ====== Footer ====== */
footer {
  text-align:center; padding:24px;
  font-size:12px; color:var(--t2);
}
footer a { color:var(--t2); text-decoration:none; }

<script>
document.addEventListener('DOMContentLoaded', function(){
    if(!document.body.classList.contains('manga-page') || document.body.classList.contains('reading-manga')) return;
    
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var mangaSlug = pathParts[1] || '';
    if(!mangaSlug) return;
    
    var storageKey = 'mhfr_' + mangaSlug;
    var readChapters = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if(!readChapters.length) return;
    
    var chapters = document.querySelectorAll('.wp-manga-chapter a[href]');
    chapters.forEach(function(a){
        var href = a.getAttribute('href').replace(/\/$/, '');
        for(var i=0; i<readChapters.length; i++){
            if(href === readChapters[i].replace(/\/$/, '')){
                a.closest('.wp-manga-chapter').classList.add('visited');
                break;
            }
        }
    });
});
</script>

<script>
jQuery(document).ready(function($){
    var $wrapper = $('#chapter-menu');
    if($wrapper.length) $wrapper.show();
    
    // Read tracking with localStorage
    var mangaSlug = window.location.pathname.split('/').filter(Boolean)[1] || 'manga';
    var storageKey = 'mhfr_' + mangaSlug;
    function markAsRead(chapterUrl){
        var list = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if(list.indexOf(chapterUrl) === -1) { list.push(chapterUrl); }
        localStorage.setItem(storageKey, JSON.stringify(list));
    }
    function isRead(chapterUrl){
        var list = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return list.indexOf(chapterUrl) !== -1;
    }
    function populateChapterMenu(){
        var $select = $('#chapter-data-hidden select');
        var $dropdown = $('#chapter-menu-dropdown');
        if(!$select.length || !$dropdown.length) return;
        var html = '<div class="menu-header">전체 회차</div>';
        var currentUrl = '';
        $select.find('option').each(function(){
            var url = $(this).val();
            var text = $(this).text();
            var sel = $(this).is(':selected');
            if(sel) currentUrl = url;
            var cls = sel ? 'current' : '';
            if(isRead(url) && !sel) cls += ' read';
            html += '<a href="' + url + '" class="' + cls + '">' + text + (isRead(url) ? ' ✓' : '') + '</a>';
        });
        $dropdown.html(html);
        // Mark current chapter as read
        if(currentUrl) markAsRead(currentUrl);
    }
    populateChapterMenu();
    
    $('#chapter-menu .chapter-menu-btn').on('click', function(e){
        e.stopPropagation();
        $('#chapter-menu-dropdown').toggleClass('show');
    });
    $(document).on('click', function(){
        $('#chapter-menu-dropdown').removeClass('show');
    });
});
</script>

<script>
(function(){
    var isMobile = window.innerWidth <= 768;

    var hideTimer = null;
    function hideNav(){
        document.body.classList.remove('show-nav');
        clearTimeout(hideTimer);
    }
    function showNav(){
        document.body.classList.add('show-nav');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hideNav, 3000);
    }
    // Show on load
    showNav();
    // Tap to toggle
    document.addEventListener('click', function(e){
        if(e.target.closest('.vw-side')) return;
        if(e.target.closest('a,button,input,select,textarea')) return;
        if(document.body.classList.contains('show-nav')){ hideNav(); }
        else { showNav(); }
    });
    // Scroll hides if shown
    document.addEventListener('scroll', function(){
        if(document.body.classList.contains('show-nav')) hideNav();
    }, {passive:true});
})();
</script>
